# --- Equilibria & Validation Status ---
equilibria.non_autonomous.title=Неавтономно уравнение
equilibria.non_autonomous.header=Равновесните точки не са дефинирани
equilibria.non_autonomous.content=Уравнението зависи изрично от t: dx/dt = f(t, x).\n\nРавновесни точки се дефинират само за автономни ОДУ:\ndx/dt = f(x).\n\nЗа анализ на криви с нулев наклон, използвайте инструмента Изоклини (c = 0).

