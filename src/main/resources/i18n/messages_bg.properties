# --- Isoclines ---
isoclines.title=dfieldX — Метод на изоклините
isoclines.header=МЕТОД НА ИЗОКЛИНИТЕ: f(t, x) = c
isoclines.intro=Изоклината събира всички точки в равнината, където полето има еднакъв постоянен наклон c:
isoclines.slope=Наклон (c):
isoclines.show=Показване на изоклини върху полето
isoclines.lock_zero=Заключи нулева изоклина [c = 0] (Пунктирано злато)
isoclines.zero=★ НУЛЕВА ИЗОКЛИНА (c = 0):\nКрива, където решенията имат строго хоризонтални допирателни (x' = 0). Отбелязва границата на преход: решенията достигат локални максимуми, минимуми или инфлексии.
isoclines.pos=▲ ПОЛОЖИТЕЛНА ИЗОКЛИНА (c = +{0}):\nРешенията, пресичащи тази крива, имат положителен наклон, нарастващ с моментна скорост {1}.
isoclines.neg=▼ ОТРИЦАТЕЛНА ИЗОКЛИНА (c = {0}):\nРешенията, пресичащи тази крива, имат отрицателен наклон, намаляващ с моментна скорост {1}.

