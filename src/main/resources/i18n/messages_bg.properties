# --- 22 Canonical Models (EN) ---
model.1.name=1. Малтусиански модел (Експоненциален растеж)
model.1.desc=Неограничено възпроизводство на глава от населението без пространствени или хранителни ограничения.
model.2.name=2. Логистичен модел на Verhulst
model.2.desc=Популационно насищане с капацитет на средата K.
model.3.name=3. Логистичен с постоянен улов
model.3.desc=Извличане на фиксирана квота, показващо колапс седло-възел и изчезване.
model.4.name=4. Логистичен с улов според усилието
model.4.desc=Извличане пропорционално на плътността (E*x) с транскритична бифуркация.
model.5.name=5. Логистичен със сезонен улов
model.5.desc=Неавтономен режим с периодични сезонни цикли на улов.
model.6.name=6. Модел с критичен ефект на Allee
model.6.desc=Строга бистабилност с минимален праг за оцеляване на популацията.
model.7.name=7. Gompertz динамика на туморен растеж
model.7.desc=Динамика на туморна пролиферация с логаритмично затихване на растежа.
model.8.name=8. Алометричен растеж на Von Bertalanffy
model.8.desc=Растеж на тялото на организма, балансиращ анаболизъм и катаболизъм.
model.9.name=9. Закон за охлаждане на Newton
model.9.desc=Линеен топлообмен в изотермична среда с фиксирана околна температура.
model.10.name=10. Охлаждане с осцилираща температура
model.10.desc=Неавтономен топлопренос, подчинен на циркадна осцилация ден/нощ.
model.11.name=11. Свободно падане със съпротивление на Stokes
model.11.desc=Линейно ламинарно затихване във вискозен флуид, приближаващо терминална скорост.
model.12.name=12. Падане с квадратично аеродинамично съпротивление
model.12.desc=Турбулентно нютоново аеродинамично съпротивление с квадратично затихване.
model.13.name=13. Източване на резервоар на Torricelli
model.13.desc=Гравитационно изтичане през остър отвор с изпразване за крайно време.
model.14.name=14. RL / RC верига със синусоидално възбуждане
model.14.desc=Експоненциален преходен процес и принудено осцилаторно стационарно състояние.
model.15.name=15. Верига на радиоактивно разпадане на Bateman
model.15.desc=Кинетика на дъщерен нуклид, включваща преходен пик на равновесна активност.
model.16.name=16. Обратима химична реакция
model.16.desc=Право/обратно динамично химично равновесие от първи ред.
model.17.name=17. Изотермична автокаталитична реакция
model.17.desc=Автокаталитична кинетика, при която молекулите на продукта ускоряват собствения си синтез.
model.18.name=18. Разреждане в реактор с непрекъснато разбъркване (CSTR)
model.18.desc=Баланс на масата на разтворено вещество в съд с непрекъснат приток/отток.
model.19.name=19. Линейно уравнение (Коси изоклини)
model.19.desc=Канонично неавтономно ОДУ t - x с наклонени изоклини и линейна асимптота.
model.20.name=20. Уравнение на Riccati с преход
model.20.desc=Квадратично ОДУ на Riccati с параболична граница, разделяща ограничени от експлозивни пътища.
model.21.name=21. Нормална форма Седло-възел
model.21.desc=Универсален топологичен бифуркационен механизъм r + x^2, създаващ/унищожаващ равновесия.
model.22.name=22. Експлозия за крайно време (Blow-up)
model.22.desc=Суперлинейно ОДУ 1 + x^2, показващо тангенциални асимптоти за крайно време.

