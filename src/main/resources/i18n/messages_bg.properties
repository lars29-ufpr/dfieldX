# --- Phase Plot Non-Autonomous ---
phaseplot.non_autonomous.header=Недефинирана графика x' с/у x
phaseplot.non_autonomous.content=Даденото уравнение зависи изрично от t:\ndx/dt = f(t, x).\n\nГрафиката на фазовата линия x' спрямо x представя 1D пространството на състоянията и съществува само за автономни ОДУ:\ndx/dt = f(x).\n\nЗа анализ на скоростите на промяна, използвайте инструмента Изоклини.
