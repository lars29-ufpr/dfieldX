model.15.name=15. Цепочка радиоактивного распада Бейтмена
model.15.desc=Кинетика дочернего нуклида с пиком активности переходного равновесия.
model.16.name=16. Обратимая химическая реакция
model.16.desc=Динамическое прямое и обратное химическое равновесие первого порядка.
model.17.name=17. Изотермическая автокаталитическая реакция
model.17.desc=Автокаталитическая кинетика, где молекулы продукта ускоряют собственный синтез.
model.18.name=18. Разбавление в реакторе идеального смешения (CSTR)
model.18.desc=Баланс массы растворенного вещества в перемешиваемом резервуаре при непрерывном потоке.
model.19.name=19. Линейное уравнение (наклонные изоклины)
model.19.desc=Каноническое неавтономное ОДУ t - x с наклонными изоклинами и линейной асимптотой.
model.20.name=20. Уравнение Риккати с переходом режима
model.20.desc=Квадратичное ОДУ Риккати с параболической границей между ограниченными решениями и взрывом.
model.21.name=21. Нормальная форма седло-узловой бифуркации
model.21.desc=Универсальный топологический механизм бифуркации r + x^2 рождения и исчезновения равновесий.
model.22.name=22. Взрыв за конечное время (Blow-up)
model.22.desc=Суперлинейное ОДУ 1 + x^2 с вертикальными тангенциальными асимптотами за конечное время.
