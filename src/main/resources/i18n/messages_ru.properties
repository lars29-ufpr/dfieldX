# --- Isoclines ---
isoclines.title=dfieldX — Метод изоклин
isoclines.header=МЕТОД ИЗОКЛИН: f(t, x) = c
isoclines.intro=Изоклина собирает все точки плоскости, где поле имеет одинаковый постоянный наклон c:
isoclines.slope=Наклон (c):
isoclines.show=Показать изоклины на поле направлений
isoclines.lock_zero=Зафиксировать нулевую изоклину [c = 0] (Пунктирная золотая)
isoclines.zero=★ НУЛЕВАЯ ИЗОКЛИНА (c = 0):\nКривая, где решения имеют строго горизонтальные касательные (x' = 0). Отмечает границу перехода: решения достигают локальных максимумов, минимумов или перегибов при пересечении этой кривой.
isoclines.pos=▲ ПОЛОЖИТЕЛЬНАЯ ИЗОКЛИНА (c = +{0}):\nРешения, пересекающие эту кривую, имеют положительный наклон, возрастая с мгновенной скоростью {1}.
isoclines.neg=▼ ОТРИЦАТЕЛЬНАЯ ИЗОКЛИНА (c = {0}):\nРешения, пересекающие эту кривую, имеют отрицательный наклон, убывая с мгновенной скоростью {1}.

# --- Phase Plot ---
phaseplot.title=dfieldX — 1D Фазовый портрет: x' от x
phaseplot.info=x: [{0}, {1}] | Диапазон x'': [{2}, {3}]
phaseplot.non_autonomous.header=Неопределенный график x' от x
phaseplot.non_autonomous.content=Данное уравнение явно зависит от t:\ndx/dt = f(t, x).\n\nФазовая прямая x' от x представляет 1D пространство состояний и существует только для автономных ОДУ:\ndx/dt = f(x).\n\nДля анализа скоростей изменения этого уравнения используйте инструмент Изоклины.

