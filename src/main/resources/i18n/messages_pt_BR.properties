# --- Isóclinas ---
isoclines.title=dfieldX — Método das Isóclinas
isoclines.header=MÉTODO DAS ISÓCLINAS: f(t, x) = c
isoclines.intro=Uma isóclina reúne todos os pontos do plano onde o campo possui a mesma inclinação angular constante c:
isoclines.slope=Inclinação (c):
isoclines.show=Exibir isóclinas sobre o campo
isoclines.lock_zero=Fixar Isóclina Zero [c = 0] (Dourado tracejado)
isoclines.zero=★ ISÓCLINA ZERO (c = 0):\nCurva onde as soluções têm tangente estritamente horizontal (x' = 0). Representa a fronteira de transição: as soluções atingem pontos de máximo, mínimo ou inflexão com derivada nula ao cruzar essa curva.
isoclines.pos=▲ ISÓCLINA POSITIVA (c = +{0}):\nAs soluções que cruzam esta curva têm inclinação angular positiva, crescendo a uma taxa instantânea de {1}.
isoclines.neg=▼ ISÓCLINA NEGATIVA (c = {0}):\nAs soluções que cruzam esta curva têm inclinação angular negativa, decrescendo a uma taxa instantânea de {1}.

