# --- 22 Modelos Canônicos (PT) ---
model.1.name=1. Modelo Malthusiano (Crescimento Exponencial)
model.1.desc=Reprodução per capita irrestrita sem limitações de espaço ou alimento.

model.2.name=2. Modelo Logístico de Verhulst
model.2.desc=Saturação populacional com capacidade de suporte ambiental K.

model.3.name=3. Logístico com Colheita Constante
model.3.desc=Extração fixa por cota. Exibe bifurcação sela-nó e colapso de extinção.

model.4.name=4. Logístico com Colheita por Esforço
model.4.desc=Extração proporcional à densidade (E*x) com bifurcação transcrítica.

model.5.name=5. Logístico com Colheita Sazonal
model.5.desc=Regime não autônomo com extração periódica oscilatória sazonal.

model.6.name=6. Modelo com Efeito Allee Crítico
model.6.desc=Biestabilidade estrita com limiar de sobrevivência populacional mínimo.

model.7.name=7. Dinâmica Tumoral de Gompertz
model.7.desc=Crescimento tumoral com decaimento logarítmico da taxa proliferativa.

model.8.name=8. Equação Alométrica de von Bertalanffy
model.8.desc=Crescimento somático individual baseado no balanço anabólico e catabólico.

model.9.name=9. Lei de Resfriamento de Newton
model.9.desc=Condução térmica linear para meio isotérmico com temperatura fixa.

model.10.name=10. Resfriamento com Temperatura Oscilante
model.10.desc=Transferência de calor não autônoma sujeita a ciclo térmico dia/noite.

model.11.name=11. Queda Livre com Arrasto de Stokes
model.11.desc=Arrasto linear para corpos lentos em fluido viscoso com velocidade terminal.

model.12.name=12. Queda com Arrasto Aerodinâmico Quadrático
model.12.desc=Regime turbulento newtoniano em alta velocidade com saturação quadrática.

model.13.name=13. Drenagem Torricelliana de Reservatório
model.13.desc=Efluxo gravitacional em orifício com esvaziamento em tempo finito.

model.14.name=14. Circuito RL / RC com Excitação Senoidal
model.14.desc=Resposta transitória exponencial e regime forçado em circuitos reativos.

model.15.name=15. Cadeia Radioativa de Bateman
model.15.desc=Cinética de decaimento do isótopo filho com pico de secularidade transitória.

model.16.name=16. Reação Química Reversível
model.16.desc=Equilíbrio dinâmico direto/inverso de 1ª ordem entre reagentes e produtos.

model.17.name=17. Reação Autocatalítica Isotérmica
model.17.desc=Reação química onde a síntese do produto é acelerada por si mesma.

model.18.name=18. Tanque de Mistura com Diluição (CSTR)
model.18.desc=Conservação de massa de soluto em tanque agitado com entrada e saída de vazão.

model.19.name=19. Equação Linear (Isóclinas Oblíquas)
model.19.desc=EDO não autônoma canônica t - x com isóclinas inclinadas e assíntota oblíqua.

model.20.name=20. Equação de Riccati com Transição
model.20.desc=EDO quadrática com separatriz parabólica demarcando soluções limitadas e explosões.

model.21.name=21. Forma Normal Sela-Nó
model.21.desc=Mecanismo topológico universal de criação/aniquilação de equilíbrios r + x^2.

model.22.name=22. Explosão em Tempo Finito (Blow-up)
model.22.desc=Solução tangencial 1 + x^2 com assíntotas verticais e quebra de existência global.

