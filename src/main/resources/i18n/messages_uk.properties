# --- Isoclines ---
isoclines.title=dfieldX — Метод ізоклін
isoclines.header=МЕТОД ІЗОКЛІН: f(t, x) = c
isoclines.intro=Ізокліна збирає всі точки на площині, де поле має однаковий постійний нахил c:
isoclines.slope=Нахил (c):
isoclines.show=Відображати ізокліни на полі
isoclines.lock_zero=Фіксувати нульову ізокліну [c = 0] (Пунктирне золото)
isoclines.zero=★ НУЛЬОВА ІЗОКЛІНА (c = 0):\nКрива, де розв'язки мають строго горизонтальні дотичні (x' = 0). Позначає межу переходу: розв'язки досягають локальних максимумів, мінімумів або точок перегину.
isoclines.pos=▲ ПОЗИТИВНА ІЗОКЛІНА (c = +{0}):\nРозв'язки, що перетинають цю криву, мають додатний нахил, зростаючи з миттєвою швидкістю {1}.
isoclines.neg=▼ НЕГАТИВНА ІЗОКЛІНА (c = {0}):\nРозв'язки, що перетинають цю криву, мають від'ємний нахил, спадаючи з миттєвою швидкістю {1}.

