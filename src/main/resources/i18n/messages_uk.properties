# --- 22 Canonical Models (EN) ---
model.1.name=1. Мальтузіанська модель (Експоненціальне зростання)
model.1.desc=Необмежене відтворення на душу населення без просторових або харчових обмежень.
model.2.name=2. Логістична модель Verhulst
model.2.desc=Популяційне насичення з ємністю середовища K.
model.3.name=3. Логістична з постійним виловом
model.3.desc=Вилучення фіксованої квоти, що демонструє колапс сідло-вузол та вимирання.
model.4.name=4. Логістична з виловом за зусиллям
model.4.desc=Вилучення пропорційно щільності (E*x) з транскритичною біфуркацією.
model.5.name=5. Логістична із сезонним виловом
model.5.desc=Неавтономний режим з періодичними сезонними циклами вилову.
model.6.name=6. Модель з критичним ефектом Allee
model.6.desc=Строга бістабільність з мінімальним порогом виживання популяції.
model.7.name=7. Gompertz динаміка росту пухлини
model.7.desc=Динаміка проліферації пухлини з логарифмічним загасанням росту.
model.8.name=8. Алометричний ріст Von Bertalanffy
model.8.desc=Ріст тіла організму, що балансує анаболізм і катаболізм.
model.9.name=9. Закон охолодження Newton
model.9.desc=Лінійний теплообмін в ізотермічному середовищі з фіксованою температурою.
model.10.name=10. Охолодження з коливальною температурою
model.10.desc=Неавтономна теплопередача, підпорядкована циркадним коливанням день/ніч.
model.11.name=11. Вільне падіння з опором Stokes
model.11.desc=Лінійне ламінарне загасання у в'язкій рідині з наближенням до граничної швидкості.
model.12.name=12. Падіння з квадратичним аеродинамічним опором
model.12.desc=Турбулентний ньютонівський аеродинамічний опір з квадратичним загасанням.
model.13.name=13. Спорожнення резервуару Torricelli
model.13.desc=Гравітаційне витікання через гострий отвір зі спорожненням за кінцевий час.
model.14.name=14. RL / RC коло із синусоїдальним збудженням
model.14.desc=Експоненціальний перехідний процес та вимушений коливальний стаціонарний стан.
model.15.name=15. Ланцюг радіоактивного розпаду Bateman
model.15.desc=Кінетика дочірнього нукліда з перехідним піком рівноважної активності.
model.16.name=16. Оборотна хімічна реакція
model.16.desc=Пряма/зворотна динамічна хімічна рівновага першого порядку.
model.17.name=17. Ізотермічна автокаталітична реакція
model.17.desc=Автокаталітична кінетика, де молекули продукту прискорюють власний синтез.
model.18.name=18. Розведення в реакторі з безперервним перемішуванням (CSTR)
model.18.desc=Баланс маси розчиненої речовини в посудині з безперервним припливом/відтоком.
model.19.name=19. Лінійне рівняння (Похилі ізокліни)
model.19.desc=Канонічне неавтономне ЗДР t - x з похилими ізоклінами та лінійною асимптотою.
model.20.name=20. Рівняння Riccati з переходом
model.20.desc=Квадратичне ЗДР Riccati з параболічною межею, що розділяє обмежені та вибухові шляхи.
model.21.name=21. Нормальна форма Сідло-вузол
model.21.desc=Універсальний топологічний біфуркаційний механізм r + x^2, що створює/знищує рівноваги.
model.22.name=22. Вибух за кінцевий час (Blow-up)
model.22.desc=Суперлінійне ЗДР 1 + x^2, що демонструє тангенціальні асимптоти за кінцевий час.

