# --- 22 Canonical Models (FR) ---
model.1.name=1. Modèle Malthusien (Croissance Exponentielle)
model.1.desc=Reproduction par habitant sans restriction spatiale ou alimentaire.

model.2.name=2. Modèle Logistique de Verhulst
model.2.desc=Saturation de la population avec une capacité de charge environnementale K.

model.3.name=3. Logistique avec Prélèvement Constant
model.3.desc=Extraction à quota fixe présentant un effondrement nœud-col et une extinction.

model.4.name=4. Logistique avec Prélèvement Proportionnel à l'Effort
model.4.desc=Extraction proportionnelle à la densité (E*x) avec bifurcation transcritique.

model.5.name=5. Logistique avec Prélèvement Saisonnier
model.5.desc=Régime non autonome avec cycles de prélèvement saisonniers périodiques.

model.6.name=6. Modèle avec Effet Allee Critique
model.6.desc=Bistabilité stricte avec seuil de survie minimal viable pour la population.

model.7.name=7. Dynamique de Croissance Tumorale de Gompertz
model.7.desc=Dynamique de prolifération tumorale avec décroissance logarithmique de la croissance.

model.8.name=8. Croissance Allométrique de Von Bertalanffy
model.8.desc=Croissance de la taille corporelle de l'organisme équilibrant anabolisme et catabolisme.

model.9.name=9. Loi de Refroidissement de Newton
model.9.desc=Échange de chaleur linéaire dans un milieu isotherme avec une température ambiante fixe.

model.10.name=10. Refroidissement avec Température Oscillante
model.10.desc=Transfert de chaleur non autonome soumis à une oscillation circadienne jour/nuit.

model.11.name=11. Chute Libre avec Frottement de Stokes
model.11.desc=Amortissement laminaire linéaire dans un fluide visqueux approchant la vitesse terminale.

model.12.name=12. Chute avec Frottement Aérodynamique Quadratique
model.12.desc=Frottement aérodynamique newtonien turbulent à grande vitesse avec amortissement quadratique.

model.13.name=13. Vidange de Réservoir de Torricelli
model.13.desc=Écoulement gravitationnel à travers un orifice à arête vive avec vidange en temps fini.

model.14.name=14. Circuit RL / RC avec Commande Sinusoïdale
model.14.desc=Réponse transitoire exponentielle et régime permanent oscillatoire forcé.

model.15.name=15. Chaîne de Désintégration Radioactive de Bateman
model.15.desc=Cinétique du nucléide fils présentant un pic d'activité d'équilibre transitoire.

model.16.name=16. Réaction Chimique Réversible
model.16.desc=Équilibre chimique dynamique direct/inverse du premier ordre.

model.17.name=17. Réaction Autocatalytique Isotherme
model.17.desc=Cinétique autocatalytique où les molécules de produit accélèrent leur propre synthèse.

model.18.name=18. Dilution dans un Réacteur Agité Continu (CSTR)
model.18.desc=Bilan de masse du soluté dans une cuve bien agitée avec un flux continu d'entrée/sortie.

model.19.name=19. Équation Linéaire (Isoclines Obliques)
model.19.desc=EDO non autonome canonique t - x avec isoclines inclinées et asymptote linéaire.

model.20.name=20. Équation de Riccati avec Transition
model.20.desc=EDO de Riccati quadratique avec frontière parabolique séparant les trajectoires bornées de celles qui explosent.

model.21.name=21. Forme Normale de Nœud-Col (Saddle-Node)
model.21.desc=Mécanisme de bifurcation topologique universel r + x^2 créant/annihilant des équilibres.

model.22.name=22. Explosion en Temps Fini (Blow-up)
model.22.desc=EDO super-linéaire 1 + x^2 présentant des asymptotes tangentes en temps fini.

