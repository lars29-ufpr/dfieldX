# --- Phase Plot Non-Autonomous (Missing Keys) ---
phaseplot.non_autonomous.title=Graphique x' vs x Non Défini
phaseplot.non_autonomous.header=Graphique x' vs x Non Défini
phaseplot.non_autonomous.content=L'équation saisie dépend explicitement de t :\ndx/dt = f(t, x).\n\nLe diagramme de phase x' versus x représente l'espace d'états 1D et n'existe que pour les EDO autonomes :\ndx/dt = f(x).\n\nPour analyser les taux de variation de cette équation, utilisez le bouton Isoclines.
