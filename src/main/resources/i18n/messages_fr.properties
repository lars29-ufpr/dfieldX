# --- Isoclines ---
isoclines.title=dfieldX — Méthode des Isoclines
isoclines.header=MÉTHODE DES ISOCLINES : f(t, x) = c
isoclines.intro=Une isocline rassemble tous les points du plan où le champ a la même pente constante c :
isoclines.slope=Pente (c) :
isoclines.show=Afficher les isoclines sur le champ de directions
isoclines.lock_zero=Verrouiller l'Isocline Zéro [c = 0] (Doré Pointillé)
isoclines.zero=★ ISOCLINE ZÉRO (c = 0) :\nCourbe où les solutions ont des tangentes strictement horizontales (x' = 0). Marque la frontière de transition : les solutions atteignent des maxima, minima ou inflexions locaux en traversant cette courbe.
isoclines.pos=▲ ISOCLINE POSITIVE (c = +{0}) :\nLes solutions traversant cette courbe ont une pente positive, augmentant à un taux instantané de {1}.
isoclines.neg=▼ ISOCLINE NÉGATIVE (c = {0}) :\nLes solutions traversant cette courbe ont une pente négative, diminuant à un taux instantané de {1}.

