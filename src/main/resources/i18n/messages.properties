# --- 22 Canonical Models (EN) ---
model.1.name=1. Malthusian Model (Exponential Growth)
model.1.desc=Unrestricted per capita reproduction without spatial or food limitations.

model.2.name=2. Verhulst Logistic Model
model.2.desc=Population saturation with environmental carrying capacity K.

model.3.name=3. Logistic with Constant Harvesting
model.3.desc=Fixed-quota extraction displaying saddle-node collapse and extinction.

model.4.name=4. Logistic with Effort Harvesting
model.4.desc=Extraction proportional to density (E*x) with transcritical bifurcation.

model.5.name=5. Logistic with Seasonal Harvesting
model.5.desc=Non-autonomous regime with periodic seasonal harvesting cycles.

model.6.name=6. Model with Critical Allee Effect
model.6.desc=Strict bi-stability with minimum viable population survival threshold.

model.7.name=7. Gompertz Tumor Growth Dynamics
model.7.desc=Tumor proliferation dynamics with logarithmic growth decay.

model.8.name=8. Von Bertalanffy Allometric Growth
model.8.desc=Organism body size growth balancing anabolism and catabolism.

model.9.name=9. Newton's Law of Cooling
model.9.desc=Linear heat exchange in isothermal medium with fixed ambient temperature.

model.10.name=10. Cooling with Oscillating Temperature
model.10.desc=Non-autonomous heat transfer subject to circadian day/night oscillation.

model.11.name=11. Free Fall with Stokes Drag
model.11.desc=Linear laminar damping in viscous fluid approaching terminal velocity.

model.12.name=12. Fall with Quadratic Aerodynamic Drag
model.12.desc=Turbulent high-velocity Newtonian aerodynamic drag with quadratic damping.

model.13.name=13. Torricellian Tank Drainage
model.13.desc=Gravitational efflux through sharp orifice with finite-time emptying.

model.14.name=14. RL / RC Circuit with Sinusoidal Drive
model.14.desc=Exponential transient response and forced oscillatory steady-state.

model.15.name=15. Bateman Radioactive Decay Chain
model.15.desc=Daughter nuclide kinetics featuring transient equilibrium activity peak.

model.16.name=16. Reversible Chemical Reaction
model.16.desc=First-order forward/backward dynamic chemical equilibrium.

model.17.name=17. Isothermal Autocatalytic Reaction
model.17.desc=Autocatalytic kinetics where product molecules accelerate their own synthesis.

model.18.name=18. Continuous Stirred Tank Dilution (CSTR)
model.18.desc=Solute mass balance in well-stirred vessel under continuous wash-out inflow/outflow.

model.19.name=19. Linear Equation (Oblique Isoclines)
model.19.desc=Canonical non-autonomous ODE t - x with slant isoclines and linear asymptote.

model.20.name=20. Riccati Equation with Transition
model.20.desc=Quadratic Riccati ODE with parabolic boundary separating bounded from blow-up paths.

model.21.name=21. Saddle-Node Normal Form
model.21.desc=Universal topological bifurcation mechanism r + x^2 creating/annihilating equilibria.

model.22.name=22. Finite-Time Explosion (Blow-up)
model.22.desc=Super-linear ODE 1 + x^2 exhibiting finite-time tangent asymptotes.

