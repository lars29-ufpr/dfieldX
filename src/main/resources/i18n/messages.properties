# --- Isoclines ---
isoclines.title=dfieldX — Isoclines Method
isoclines.header=ISOCLINES METHOD: f(t, x) = c
isoclines.intro=An isocline collects all points in the plane where the field has the same constant slope c:
isoclines.slope=Slope (c):
isoclines.show=Display isoclines on direction field
isoclines.lock_zero=Lock Zero Isocline [c = 0] (Dashed Gold)
isoclines.zero=★ ZERO ISOCLINE (c = 0):\nCurve where solutions have strictly horizontal tangents (x' = 0). Marks the transition boundary: solutions reach local maxima, minima, or inflections when crossing this curve.
isoclines.pos=▲ POSITIVE ISOCLINE (c = +{0}):\nSolutions crossing this curve have positive slope, increasing at an instantaneous rate of {1}.
isoclines.neg=▼ NEGATIVE ISOCLINE (c = {0}):\nSolutions crossing this curve have negative slope, decreasing at an instantaneous rate of {1}.

