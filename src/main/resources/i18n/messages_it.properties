status.equilibria_calculated=Punti di equilibrio calcolati e tracciati per il dominio visibile.
status.equilibria_disabled=Visualizzazione dei punti di equilibrio disabilitata.

# --- 22 Canonical Models ---
model.1.name=1. Modello Malthusiano (Crescita Esponenziale)
model.1.desc=Riproduzione pro capite illimitata senza vincoli spaziali o alimentari.
model.2.name=2. Modello Logistico di Verhulst
model.2.desc=Saturazione della popolazione con capacità portante ambientale K.
model.3.name=3. Modello Logistico con Raccolto Costante
model.3.desc=Estrazione a quota fissa con collasso a sella-nodo ed estinzione.
model.4.name=4. Modello Logistico con Raccolto Proporzionale
model.4.desc=Estrazione proporzionale alla densità (E*x) con biforcazione transcrittica.
model.5.name=5. Modello Logistico con Raccolto Stagionale
model.5.desc=Regime non autonomo con cicli stagionali periodici.
model.6.name=6. Modello con Effetto Allee Critico
model.6.desc=Bistabilità rigorosa con soglia di sopravvivenza minima della popolazione.
model.7.name=7. Dinamica di Crescita Tumorale di Gompertz
model.7.desc=Proliferazione tumorale con decadimento logaritmico della crescita.
model.8.name=8. Crescita Allometrica di Von Bertalanffy
model.8.desc=Crescita dimensionale dell'organismo che bilancia anabolismo e catabolismo.
model.9.name=9. Legge di Raffreddamento di Newton
model.9.desc=Scambio termico lineare in mezzo isotermo con temperatura ambiente fissa.
model.10.name=10. Raffreddamento con Temperatura Oscillante
model.10.desc=Trasferimento di calore non autonomo soggetto a oscillazione circadiana.
model.11.name=11. Caduta Libera con Attrito di Stokes
model.11.desc=Smorzamento laminare lineare in fluido viscoso verso la velocità terminale.
model.12.name=12. Caduta con Attrito Aerodinamico Quadratico
model.12.desc=Attrito aerodinamico Newtoniano turbolento ad alta velocità.
model.13.name=13. Svuotamento del Serbatoio di Torricelli
model.13.desc=Efflusso gravitazionale attraverso orifizio con svuotamento in tempo finito.
model.14.name=14. Circuito RL / RC con Forzante Sinusoidale
model.14.desc=Risposta transitoria esponenziale e stato stazionario oscillatorio forzato.
model.15.name=15. Catena di Decadimento Radioattivo di Bateman
model.15.desc=Cinetica del nuclide figlio con picco transitorio di attività in equilibrio.
model.16.name=16. Reazione Chimica Reversibile
model.16.desc=Equilibrio chimico dinamico di primo ordine (diretto/inverso).
model.17.name=17. Reazione Autocatalitica Isoterma
model.17.desc=Cinetica autocatalitica in cui il prodotto accelera la propria sintesi.
model.18.name=18. Reattore a Serbatoio Agitato Continuo (CSTR)
model.18.desc=Bilancio di massa in un recipiente ben miscelato con flusso continuo.
model.19.name=19. Equazione Lineare (Isocline Oblique)
model.19.desc=ODE canonica non autonoma t - x con isocline inclinate e asintoto lineare.
model.20.name=20. Equazione di Riccati con Transizione
model.20.desc=ODE quadratica con confine parabolico che separa percorsi limitati da esplosioni.
model.21.name=21. Forma Normale Sella-Nodo
model.21.desc=Meccanismo universale di biforcazione topologica r + x^2.
model.22.name=22. Esplosione in Tempo Finito (Blow-up)
model.22.desc=ODE super-lineare 1 + x^2 con asintoti tangenti in tempo finito.

