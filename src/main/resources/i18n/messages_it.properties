# --- Equilibria & Validation Status ---
equilibria.non_autonomous.title=Equazione Non Autonoma
equilibria.non_autonomous.header=Punti di Equilibrio Non Definiti
equilibria.non_autonomous.content=L'equazione dipende esplicitamente da t: dx/dt = f(t, x).\n\nI punti di equilibrio sono definiti solo per le ODE autonome dx/dt = f(x).\n\nPer analizzare le curve a pendenza nulla, usa lo strumento Isocline con c = 0.

