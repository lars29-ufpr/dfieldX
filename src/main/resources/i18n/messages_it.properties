# --- Isoclines ---
isoclines.title=dfieldX \u2014 Metodo delle Isocline
isoclines.header=METODO DELLE ISOCLINE: f(t, x) = c
isoclines.intro=Un'isoclina raccoglie tutti i punti nel piano in cui il campo ha la stessa pendenza costante c:
isoclines.slope=Pendenza (c):
isoclines.show=Mostra le isocline sul campo di direzioni
isoclines.lock_zero=Fissa Isoclina Nulla [c = 0] (Oro Tratteggiato)
isoclines.zero=\u2605 ISOCLINA NULLA (c = 0):\nCurva in cui le soluzioni hanno tangenti strettamente orizzontali (x' = 0). Segna il limite di transizione: le soluzioni raggiungono massimi, minimi o flessi.
isoclines.pos=\u25b2 ISOCLINA POSITIVA (c = +{0}):\nLe soluzioni che incrociano questa curva hanno pendenza positiva, crescendo a un tasso istantaneo di {1}.
isoclines.neg=\u25bc ISOCLINA NEGATIVA (c = {0}):\nLe soluzioni che incrociano questa curva hanno pendenza negativa, decrescendo a un tasso istantaneo di {1}.

