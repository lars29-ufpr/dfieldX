equilibria.non_autonomous.header=Gleichgewichtspunkte nicht definiert
equilibria.non_autonomous.content=Die Gleichung hängt explizit von t ab: dx/dt = f(t, x).\n\nGleichgewichtspunkte sind nur für autonome DGL dx/dt = f(x) definiert.\n\nVerwenden Sie das Isoklinen-Werkzeug mit c = 0, um Kurven mit Steigung null zu analysieren.

