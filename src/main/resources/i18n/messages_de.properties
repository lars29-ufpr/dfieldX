# --- 22 Canonical Models ---
model.1.name=1. Malthusianisches Modell (Exponentielles Wachstum)
model.1.desc=Uneingeschränkte Pro-Kopf-Reproduktion ohne räumliche oder Nahrungsbeschränkungen.
model.2.name=2. Logistisches Modell von Verhulst
model.2.desc=Populationssättigung mit ökologischer Tragfähigkeit K.
model.3.name=3. Logistisches Modell mit konstanter Ernte
model.3.desc=Gewinnung mit fester Quote, die Sattelknoten-Kollaps und Aussterben zeigt.
model.4.name=4. Logistisches Modell mit Aufwand-Ernte
model.4.desc=Dichte-proportionale Extraktion (E*x) mit transkritischer Bifurkation.
model.5.name=5. Logistisches Modell mit saisonaler Ernte
model.5.desc=Nichtautonomes Regime mit periodischen saisonalen Erntezyklen.
model.6.name=6. Modell mit kritischem Allee-Effekt
model.6.desc=Strenge Bistabilität mit minimaler überlebensfähiger Populationsschwelle.
model.7.name=7. Gompertz-Tumorwachstumsdynamik
model.7.desc=Tumorproliferationsdynamik mit logarithmischem Wachstumsabfall.
model.8.name=8. Allometrisches Wachstum nach Von Bertalanffy
model.8.desc=Körpergrößenwachstum von Organismen, das Anabolismus und Katabolismus ausgleicht.
model.9.name=9. Newtonsches Abkühlungsgesetz
model.9.desc=Linearer Wärmeaustausch in isothermem Medium mit fester Umgebungstemperatur.
model.10.name=10. Abkühlung mit oszillierender Temperatur
model.10.desc=Nichtautonome Wärmeübertragung abhängig von zirkadianer Tag/Nacht-Oszillation.
model.11.name=11. Freier Fall mit Stokes-Reibung
model.11.desc=Lineare laminare Dämpfung in viskosem Fluid, die sich der Endgeschwindigkeit nähert.
model.12.name=12. Fall mit quadratischem aerodynamischem Widerstand
model.12.desc=Turbulenter Newtonscher Luftwiderstand bei hoher Geschwindigkeit mit quadratischer Dämpfung.
model.13.name=13. Torricellische Tankentleerung
model.13.desc=Gravitationsausfluss durch scharfe Öffnung mit Entleerung in endlicher Zeit.
model.14.name=14. RL / RC Schwingkreis
model.14.desc=Exponentielle transiente Antwort und erzwungener oszillatorischer stationärer Zustand.
model.15.name=15. Bateman-Zerfallsgesetz
model.15.desc=Kinetik der Tochternuklide mit transientem Aktivitätsmaximum im Gleichgewicht.
model.16.name=16. Reversible chemische Reaktion
model.16.desc=Dynamisches chemisches Gleichgewicht erster Ordnung (vorwärts/rückwärts).
model.17.name=17. Isotherme autokatalytische Reaktion
model.17.desc=Autokatalytische Kinetik, bei der Produktmoleküle ihre eigene Synthese beschleunigen.
model.18.name=18. Kontinuierlicher Rührkesselreaktor (CSTR)
model.18.desc=Stoffbilanz in gut gerührtem Behälter bei kontinuierlichem Zu-/Abfluss.
model.19.name=19. Lineare Gleichung (Schräge Isoklinen)
model.19.desc=Kanonische nichtautonome DGL t - x mit schrägen Isoklinen und linearer Asymptote.
model.20.name=20. Riccati-Gleichung mit Übergang
model.20.desc=Quadratische Riccati-DGL mit parabolischer Grenze, die beschränkte von explodierenden Pfaden trennt.
model.21.name=21. Sattelknoten-Normalform
model.21.desc=Universeller topologischer Bifurkationsmechanismus r + x^2.
model.22.name=22. Explosion in endlicher Zeit (Blow-up)
model.22.desc=Superlineare DGL 1 + x^2 mit Tangenten-Asymptoten in endlicher Zeit.

