# --- Isoclines ---
isoclines.title=dfieldX \u2014 Isoklinenmethode
isoclines.header=ISOKLINENMETHODE: f(t, x) = c
isoclines.intro=Eine Isokline sammelt alle Punkte in der Ebene, an denen das Feld die gleiche konstante Steigung c hat:
isoclines.slope=Steigung (c):
isoclines.show=Isoklinen auf dem Feld anzeigen
isoclines.lock_zero=Nullisokline fixieren [c = 0] (Gestricheltes Gold)
isoclines.zero=\u2605 NULLISOKLINE (c = 0):\nKurve, bei der die Lösungen streng horizontale Tangenten haben (x' = 0). Markiert die Übergangsgrenze: Lösungen erreichen lokale Maxima, Minima oder Wendepunkte, wenn sie diese Kurve kreuzen.
isoclines.pos=\u25b2 POSITIVE ISOKLINE (c = +{0}):\nLösungen, die diese Kurve kreuzen, haben eine positive Steigung und steigen mit einer momentanen Rate von {1}.
isoclines.neg=\u25bc NEGATIVE ISOKLINE (c = {0}):\nLösungen, die diese Kurve kreuzen, haben eine negative Steigung und fallen mit einer momentanen Rate von {1}.

