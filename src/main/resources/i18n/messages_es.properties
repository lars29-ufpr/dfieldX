isoclines.zero=★ ISOCLINA CERO (c = 0):\nCurva donde las soluciones tienen tangentes estrictamente horizontales (x' = 0). Marca el límite de transición: las soluciones alcanzan máximos locales, mínimos o inflexiones al cruzar esta curva.
isoclines.pos=▲ ISOCLINA POSITIVA (c = +{0}):\nLas soluciones que cruzan esta curva tienen pendiente positiva, creciendo a una tasa instantánea de {1}.
isoclines.neg=▼ ISOCLINA NEGATIVA (c = {0}):\nLas soluciones que cruzan esta curva tienen pendiente negativa, decreciendo a una tasa instantánea de {1}.
