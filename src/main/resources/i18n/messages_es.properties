# --- 22 Modelos Canónicos (ES) ---
model.1.name=1. Modelo Malthusiano (Crecimiento Exponencial)
model.1.desc=Reproducción per cápita sin restricciones espaciales ni alimentarias.
model.2.name=2. Modelo Logístico de Verhulst
model.2.desc=Saturación poblacional con capacidad de carga ambiental K.
model.3.name=3. Modelo Logístico con Cosecha Constante
model.3.desc=Extracción con cuota fija mostrando colapso silla-nodo y extinción.
model.4.name=4. Modelo Logístico con Esfuerzo de Cosecha
model.4.desc=Extracción proporcional a la densidad (E*x) con bifurcación transcrítica.
model.5.name=5. Modelo Logístico con Cosecha Estacional
model.5.desc=Régimen no autónomo con ciclos periódicos de cosecha estacional.
model.6.name=6. Modelo con Efecto Allee Crítico
model.6.desc=Biestabilidad estricta con umbral mínimo de supervivencia poblacional viable.
model.7.name=7. Dinámica de Crecimiento Tumoral de Gompertz
model.7.desc=Dinámica de proliferación tumoral con decaimiento de crecimiento logarítmico.
model.8.name=8. Crecimiento Alométrico de Von Bertalanffy
model.8.desc=Crecimiento del tamaño corporal del organismo equilibrando anabolismo y catabolismo.
model.9.name=9. Ley de Enfriamiento de Newton
model.9.desc=Intercambio de calor lineal en medio isotérmico con temperatura ambiente fija.
model.10.name=10. Enfriamiento con Temperatura Oscilante
model.10.desc=Transferencia de calor no autónoma sujeta a oscilación circadiana día/noche.
model.11.name=11. Caída Libre con Fricción de Stokes
model.11.desc=Amortiguamiento laminar lineal en fluido viscoso acercándose a la velocidad terminal.
model.12.name=12. Caída con Resistencia Aerodinámica Cuadrática
model.12.desc=Resistencia aerodinámica newtoniana turbulenta a alta velocidad con amortiguamiento cuadrático.
model.13.name=13. Drenaje de Tanque de Torricelli
model.13.desc=Flujo gravitacional a través de un orificio agudo con vaciado en tiempo finito.
model.14.name=14. Circuito RL / RC con Fuente Sinusoidal
model.14.desc=Respuesta transitoria exponencial y estado estacionario oscilatorio forzado.
model.15.name=15. Cadena de Desintegración Radiactiva de Bateman
model.15.desc=Cinética del nucleido hijo presentando un pico de actividad en equilibrio transitorio.
model.16.name=16. Reacción Química Reversible
model.16.desc=Equilibrio químico dinámico de primer orden directo/inverso.
model.17.name=17. Reacción Autocatalítica Isotérmica
model.17.desc=Cinética autocatalítica donde las moléculas del producto aceleran su propia síntesis.
model.18.name=18. Dilución en Tanque Agitado Continuo (CSTR)
model.18.desc=Balance de masa del soluto en un recipiente bien agitado con flujo de entrada/salida continuo.
model.19.name=19. Ecuación Lineal (Isoclinas Oblicuas)
model.19.desc=EDO no autónoma canónica t - x con isoclinas inclinadas y asíntota lineal.
model.20.name=20. Ecuación de Riccati con Transición
model.20.desc=EDO de Riccati cuadrática con límite parabólico que separa trayectorias acotadas de las que explotan.
model.21.name=21. Forma Normal Silla-Nodo
model.21.desc=Mecanismo topológico universal de bifurcación r + x^2 que crea/aniquila puntos de equilibrio.
model.22.name=22. Explosión en Tiempo Finito (Blow-up)
model.22.desc=EDO superlineal 1 + x^2 que exhibe asíntotas tangentes en tiempo finito.
